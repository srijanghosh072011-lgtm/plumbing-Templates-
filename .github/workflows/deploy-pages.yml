name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/site-replica-seo-aeo-jq5wjt, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # This repo is a project page (github.io/<repo>/), not a root user/org
      # page, so every root-relative href/src in the templates (correct for
      # the real target: a custom domain at the root) needs the /<repo>/
      # prefix or the deployed preview shows unstyled, brokenly-linked HTML.
      # scripts/build.mjs applies this as a post-process when BASE_PATH is set;
      # it is a no-op for every other build path (npm run dev, preflight, etc).
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
