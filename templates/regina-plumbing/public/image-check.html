<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Image check — 15 files</title>
<style>
  body{font:16px/1.5 system-ui,sans-serif;margin:0;padding:24px;background:#0d1428;color:#f4f2ee}
  h1{font-size:20px;margin:0 0 4px}
  p{color:#b9c2d8;margin:0 0 24px;font-size:14px}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  figure{margin:0;background:#141d3a;border:1px solid #2a3b6d;border-radius:12px;overflow:hidden}
  img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#3d5390}
  figcaption{padding:10px 12px;font-size:12px;word-break:break-all}
  figcaption span{color:#8fa3cc}
</style>
</head>
<body>
<h1>Image check — 15 files</h1>
<p>Plain &lt;img&gt; tags, no CSS overlays, no lazy loading. Every tile below should show a
photograph. A grey/broken tile means that exact file is not being served.
Uses relative paths, so it works regardless of how the site is hosted.</p>
<div class="grid">
  <figure>
    <img src="./images/about-portrait.webp" alt="about-portrait.webp" loading="eager">
    <figcaption><b>about-portrait.webp</b><br><span>45 kB</span></figcaption>
