<meta charset="utf-8">
<title>Ghosh Designs — avatar export sheet</title>
<style>
  html,body{margin:0;background:#888}
  .tile{width:1024px;height:1024px;display:grid;place-items:center;overflow:hidden}
  .tile svg{display:block}
  /* circle-crop safety guide, toggled off for the real export */
  .guide{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 1px #0f0 inset;display:none}
</style>

<div class="tile" id="t-aperture" style="background:#0A0A0B;color:#EFEFEC;--accent:#3D5BFF">
  <svg width="780" height="780" viewBox="0 0 100 100" aria-label="Ghosh Designs">
    <g fill="none" stroke-width="9">
      <path d="M 80.82 64.37 A 34 34 0 1 1 84 50" stroke="currentColor"/>
      <path d="M 88.5 50 H 58" stroke="var(--accent)"/>
    </g>
  </svg>
</div>

<div class="tile" id="t-counter" style="background:#14140F;color:#DAD7CE">
  <svg width="720" height="720" viewBox="0 0 100 100" aria-label="Ghosh Designs">
    <mask id="av-counter">
      <rect width="100" height="100" fill="#000"/>
      <circle cx="50" cy="50" r="42" fill="#fff"/>
      <rect x="32" y="32" width="36" height="36" fill="#000"/>
      <rect x="60" y="56" width="45" height="12" fill="#000"/>
      <rect x="56" y="44" width="36" height="12" fill="#fff"/>
    </mask>
    <circle cx="50" cy="50" r="42" fill="currentColor" mask="url(#av-counter)"/>
  </svg>
</div>

<!-- Seal uses the solid variant: the double rings clog at avatar sizes. -->
<div class="tile" id="t-seal" style="background:#221C16;color:#EDE9E0">
  <svg width="1120" height="1120" viewBox="0 0 100 100" aria-label="Ghosh Designs">
    <mask id="av-seal">
      <rect width="100" height="100" fill="#000"/>
      <circle cx="50" cy="50" r="27" fill="#fff"/>
      <ellipse cx="50" cy="50" rx="15" ry="20.5" fill="#000"/>
      <rect x="50" y="56" width="42" height="12" fill="#000"/>
      <rect x="55" y="48" width="26" height="8" fill="#fff"/>
      <rect x="55" y="48" width="3.6" height="13" fill="#fff"/>
    </mask>
    <circle cx="50" cy="50" r="27" fill="currentColor" mask="url(#av-seal)"/>
  </svg>
</div>
