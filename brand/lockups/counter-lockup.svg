<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="1000" height="240" role="img" aria-label="Ghosh Designs">
  <title>Ghosh Designs — Counter lockup</title>
  <defs>
    <mask id="lk-counter-g">
      <rect x="0" y="0" width="100" height="100" fill="#000"/>
      <circle cx="50" cy="50" r="42" fill="#fff"/>
      <rect x="32" y="32" width="36" height="36" fill="#000"/>
      <rect x="60" y="56" width="45" height="12" fill="#000"/>
      <rect x="56" y="44" width="36" height="12" fill="#fff"/>
    </mask>
  </defs>

  <g transform="translate(12,10)">
    <g transform="translate(50,50) scale(1.06) translate(-50,-50)">
      <circle cx="50" cy="50" r="42" fill="currentColor" mask="url(#lk-counter-g)"/>
    </g>
  </g>

  <!-- Wordmark. Convert to outlines with the licensed face before production use. -->
  <text x="140" y="60" dominant-baseline="central"
        font-family="'Clash Display','Plus Jakarta Sans',ui-sans-serif,system-ui"
        font-size="41" font-weight="700" letter-spacing="-1.4" fill="currentColor">Ghosh Designs</text>
</svg>
