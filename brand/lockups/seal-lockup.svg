<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="1000" height="240" role="img" aria-label="Ghosh Designs">
  <title>Ghosh Designs — Seal lockup</title>
  <defs>
    <mask id="lk-seal-counter">
      <rect x="0" y="0" width="100" height="100" fill="#000"/>
      <circle cx="50" cy="50" r="27" fill="#fff"/>
      <ellipse cx="50" cy="50" rx="15" ry="20.5" fill="#000"/>
      <rect x="50" y="56" width="42" height="12" fill="#000"/>
      <rect x="55" y="48" width="26" height="8" fill="#fff"/>
      <rect x="55" y="48" width="3.6" height="13" fill="#fff"/>
    </mask>
  </defs>

  <g transform="translate(12,10)">
    <g fill="none" stroke="currentColor" stroke-width="0.9">
      <circle cx="50" cy="50" r="47"/>
      <circle cx="50" cy="50" r="44.2"/>
    </g>
    <g fill="currentColor">
      <rect x="49.6" y="3" width="0.8" height="2.8"/>
      <rect x="49.6" y="94.2" width="0.8" height="2.8"/>
      <rect x="3" y="49.6" width="2.8" height="0.8"/>
      <rect x="94.2" y="49.6" width="2.8" height="0.8"/>
    </g>
    <circle cx="50" cy="50" r="27" fill="currentColor" mask="url(#lk-seal-counter)"/>
  </g>

  <!-- Wordmark. Convert to outlines with the licensed face before production use. -->
  <text x="140" y="60" dominant-baseline="central"
        font-family="'PP Editorial New','Canela','Playfair Display',ui-serif,Georgia,serif"
        font-size="42" letter-spacing="0.5" fill="currentColor">Ghosh Designs</text>
</svg>
